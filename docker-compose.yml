services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092"
      KAFKA_LISTENERS: "CONTROLLER://:9093,PLAINTEXT_HOST://:9092,PLAINTEXT://:29092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ecommerce-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  auth-postgres:
    image: postgres:17
    container_name: ecommerce-auth-postgres
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: ecommerce-auth-service
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@auth-postgres:5432/${AUTH_DB_NAME}?schema=public"
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3001:3001"
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  customer-postgres:
    image: postgres:17
    container_name: ecommerce-customer-postgres
    environment:
      POSTGRES_USER: ${CUSTOMER_DB_USER}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      POSTGRES_DB: ${CUSTOMER_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - customer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CUSTOMER_DB_USER} -d ${CUSTOMER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  customer-service:
    build:
      context: .
      dockerfile: ./services/customer-service/Dockerfile
    container_name: ecommerce-customer-service
    environment:
      PORT: 3002
      GRPC_PORT: 50052
      DATABASE_URL: "postgresql://${CUSTOMER_DB_USER}:${CUSTOMER_DB_PASSWORD}@customer-postgres:5432/${CUSTOMER_DB_NAME}?schema=public"
    ports:
      - "3002:3002"
      - "50052:50052"
    depends_on:
      customer-postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  order-postgres:
    image: postgres:17
    container_name: ecommerce-order-postgres
    environment:
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER} -d ${ORDER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network
  order-service:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile

    container_name: ecommerce-order-service

    environment:
      PORT: 3004

      DATABASE_URL: "postgresql://${ORDER_DB_USER}:${ORDER_DB_PASSWORD}@order-postgres:5432/${ORDER_DB_NAME}?schema=public"

      CUSTOMER_GRPC_URL: "customer-service:50052"
      PRODUCT_GRPC_URL: "product-service:50053"

      KAFKA_BROKERS: "kafka:29092"
      KAFKA_CLIENT_ID: "order-service"
      KAFKA_ORDER_CREATED_TOPIC: "order-created"

      OUTBOX_PUBLISH_INTERVAL_MS: 2000
      KAFKAJS_NO_PARTITIONER_WARNING: 1

    ports:
      - "3004:3004"

    depends_on:
      order-postgres:
        condition: service_healthy

      customer-service:
        condition: service_healthy

      product-service:
        condition: service_healthy

      kafka:
        condition: service_healthy

    networks:
      - ecommerce-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  product-service:
    build:
      context: .
      dockerfile: ./services/product-service/Dockerfile

    container_name: ecommerce-product-service

    environment:
      PORT: 3003
      GRPC_PORT: 50053
      MONGODB_URI: "mongodb://${PRODUCT_MONGO_USER}:${PRODUCT_MONGO_PASSWORD}@product-mongodb:27017/product_db?authSource=admin"

    ports:
      - "3003:3003"
      - "50053:50053"

    depends_on:
      product-mongodb:
        condition: service_healthy

    networks:
      - ecommerce-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  product-mongodb:
    image: mongo:8
    container_name: ecommerce-product-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PRODUCT_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PRODUCT_MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - product-mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "${PRODUCT_MONGO_USER}",
          "--password",
          "${PRODUCT_MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  shipment-mongodb:
    image: mongo:8
    container_name: ecommerce-shipment-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SHIPMENT_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${SHIPMENT_MONGO_PASSWORD}
    ports:
      - "27018:27017"
    volumes:
      - shipment-mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "${SHIPMENT_MONGO_USER}",
          "--password",
          "${SHIPMENT_MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network
  shipment-service:
    build:
      context: .
      dockerfile: ./services/shipment-service/Dockerfile

    container_name: ecommerce-shipment-service

    environment:
      PORT: 3005

      MONGODB_URI: "mongodb://${SHIPMENT_MONGO_USER}:${SHIPMENT_MONGO_PASSWORD}@shipment-mongodb:27017/shipment_db?authSource=admin"

      KAFKA_BROKERS: "kafka:29092"
      KAFKA_CLIENT_ID: "shipment-service"
      KAFKA_GROUP_ID: "shipment-order-created-group"
      KAFKA_ORDER_CREATED_TOPIC: "order-created"

      KAFKAJS_NO_PARTITIONER_WARNING: 1

    ports:
      - "3005:3005"

    depends_on:
      shipment-mongodb:
        condition: service_healthy

      kafka:
        condition: service_healthy

    networks:
      - ecommerce-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  redis:
    image: redis:7.4-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network
  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile

    container_name: ecommerce-api-gateway

    environment:
      PORT: "3000"

      REDIS_URL: "redis://redis:6379"

      JWT_SECRET: ${JWT_SECRET}

      AUTH_SERVICE_URL: "http://auth-service:3001"
      CUSTOMER_SERVICE_URL: "http://customer-service:3002"
      PRODUCT_SERVICE_URL: "http://product-service:3003"
      ORDER_SERVICE_URL: "http://order-service:3004"
      SHIPMENT_SERVICE_URL: "http://shipment-service:3005"

      RATE_LIMIT_WINDOW_SECONDS: "60"
      RATE_LIMIT_MAX_REQUESTS: "100"
      AUTH_RATE_LIMIT_MAX_REQUESTS: "10"

      PRODUCT_CACHE_TTL_SECONDS: "60"

    ports:
      - "3000:3000"

    depends_on:
      redis:
        condition: service_healthy

      auth-service:
        condition: service_healthy

      customer-service:
        condition: service_healthy

      product-service:
        condition: service_healthy

      order-service:
        condition: service_healthy

      shipment-service:
        condition: service_healthy

    networks:
      - ecommerce-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  auth-postgres-data:
  customer-postgres-data:
  order-postgres-data:
  product-mongodb-data:
  shipment-mongodb-data:
  redis-data:
  kafka-data:

networks:
  ecommerce-network:
    driver: bridge